name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Self-test (offline end-to-end check)
        run: python -m server.selftest

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Rebuild webapp/ and check it is committed
        run: |
          python make_webapp.py
          git diff --exit-code webapp/
